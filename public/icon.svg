<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with subtle dark gradient -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Vinyl Record Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="#121215" stroke="#27272a" stroke-width="3"/>
  <circle cx="256" cy="256" r="135" fill="none" stroke="#1f1f23" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1f1f23" stroke-width="1.5"/>

  <!-- Glowing Accent Badge Center -->
  <circle cx="256" cy="256" r="76" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Play & Wave Icon Center -->
  <polygon points="244,222 284,256 244,290" fill="#ffffff"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff" opacity="0.3"/>
</svg>
